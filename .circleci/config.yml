version: 2.1

# CI for the core rewrite on next: formatting and all core test suites.

commands:
  install-clojure:
    description: "Install the Clojure CLI"
    steps:
      - run:
          name: Install Clojure CLI 1.12.0.1488
          command: |
            if ! command -v clojure &> /dev/null; then
              curl -L -O https://download.clojure.org/install/linux-install-1.12.0.1488.sh
              chmod +x linux-install-1.12.0.1488.sh
              sudo ./linux-install-1.12.0.1488.sh
              rm linux-install-1.12.0.1488.sh
            fi

executors:
  clojure-java22:
    docker:
      - image: cimg/openjdk:22.0
    working_directory: ~/repo
    resource_class: large
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1500m"

jobs:
  setup:
    executor: clojure-java22
    steps:
      - checkout
      - install-clojure
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "deps.edn" }}
            - v1-deps-
      - run:
          name: Download dependencies
          command: |
            clojure -P -M:test
            clojure -P -M:format
      - save_cache:
          paths:
            - ~/.m2
            - ~/.gitlibs
          key: v1-deps-{{ checksum "deps.edn" }}
      - persist_to_workspace:
          root: ~/
          paths:
            - repo

  format:
    executor: clojure-java22
    steps:
      - attach_workspace:
          at: ~/
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "deps.edn" }}
            - v1-deps-
      - install-clojure
      - run:
          name: Check formatting (cljfmt)
          command: clojure -M:format

  test:
    executor: clojure-java22
    steps:
      - attach_workspace:
          at: ~/
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "deps.edn" }}
            - v1-deps-
      - install-clojure
      - run:
          # W6 across a real restart: one JVM persists the evidence and exits,
          # the suite's JVM reopens only the control store.
          name: Persist lineage evidence in a separate JVM
          command: clojure -Sdeps '{:paths ["src" "test"]}' -M -m dvergr.process.lineage-test /tmp/dvergr-process-evidence
      - run:
          name: Persist discourse evidence in a separate JVM
          command: clojure -Sdeps '{:paths ["src" "test"]}' -M -m dvergr.process.discourse-test /tmp/dvergr-process-evidence
      - run:
          name: Persist live ask boundary evidence in a separate JVM
          command: clojure -Sdeps '{:paths ["src" "test"]}' -M -m dvergr.process.live-test /tmp/dvergr-process-evidence
      - run:
          name: Run all core test suites (kaocha)
          command: DVERGR_PROCESS_EVIDENCE=/tmp/dvergr-process-evidence clojure -M:test

workflows:
  version: 2
  core-checks:
    jobs:
      - setup
      - format:
          requires:
            - setup
      - test:
          requires:
            - format
